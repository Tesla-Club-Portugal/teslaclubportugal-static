name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pull-requests: write

concurrency:
  group: cf-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Resolve deploy branch label
        id: branch
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Slugified head branch, capped at 28 chars (Pages limit)
            RAW="${{ github.head_ref }}"
          else
            RAW="${{ github.ref_name }}"
          fi
          SLUG=$(echo "$RAW" | tr '/_ ' '-' | tr -cd '[:alnum:]-' | tr '[:upper:]' '[:lower:]' | cut -c1-28)
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=teslaclubportugal-static-v2 --branch=${{ steps.branch.outputs.slug }} --commit-dirty=true

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const url = `https://${{ steps.branch.outputs.slug }}.teslaclubportugal-static-v2.pages.dev`;
            const alias = `https://${{ steps.deploy.outputs.deployment-alias-url || '' }}`;
            const body = [
              `### 🌍 Preview deployment ready`,
              ``,
              `Branch: **\`${{ github.head_ref }}\`** · commit \`${{ github.event.pull_request.head.sha }}\``,
              ``,
              `- Branch alias: <${url}>`,
              `- Deployment: <${{ steps.deploy.outputs.deployment-url }}>`,
              ``,
              `_This preview updates on every push to the PR branch. When the PR is merged and its branch deleted, this preview is retired._`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const marker = 'Preview deployment ready';
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body,
              });
            }
